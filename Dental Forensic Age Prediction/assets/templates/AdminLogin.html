{% extends 'base.html' %}
{% block title %}Admin Login — DentalAge AI{% endblock %}
{% block nav_admin %}class="active"{% endblock %}

{% block extra_head %}
<style>
  .auth-wrap {
    min-height: 80vh; display: flex;
    align-items: center; justify-content: center; padding: 2rem;
  }
  .auth-box {
    width: 100%; max-width: 400px;
    background: var(--bg-card);
    border: 1px solid #2a1a3e; border-radius: 16px;
    padding: 2.5rem 2.2rem;
    box-shadow: 0 8px 60px rgba(0,0,0,.6), 0 0 40px rgba(160,80,255,.06);
    animation: fadeUp .45s ease forwards;
  }
  .auth-logo { text-align: center; margin-bottom: 2rem; }
  .auth-logo .ring {
    width: 68px; height: 68px; border-radius: 50%;
    background: linear-gradient(135deg, rgba(160,80,255,.12), rgba(100,40,200,.12));
    border: 1px solid #7030d0;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.8rem; margin: 0 auto .9rem;
    box-shadow: 0 0 24px rgba(160,80,255,.2);
  }
  .auth-logo h2 {
    font-family: var(--font-head); font-size: 1.4rem; font-weight: 700;
    letter-spacing: .1em; color: #b06cff;
  }
  .auth-logo p {
    font-family: var(--font-mono); font-size: .68rem; letter-spacing: .14em;
    color: var(--text-muted); margin-top: .2rem;
  }
  .form-control { --border-glow: #7030d0; }
  .form-control:focus { border-color: #7030d0 !important; box-shadow: 0 0 0 3px rgba(112,48,208,.15) !important; }
  .btn-admin {
    background: linear-gradient(135deg, rgba(160,80,255,.15), rgba(80,20,160,.15));
    border-color: #7030d0; color: #b06cff;
    width: 100%; justify-content: center;
  }
  .btn-admin:hover {
    background: linear-gradient(135deg, rgba(160,80,255,.28), rgba(80,20,160,.28));
    box-shadow: 0 0 20px rgba(160,80,255,.25);
  }
  .input-icon { position: relative; }
  .input-icon span { position: absolute; left: .9rem; top: 50%; transform: translateY(-50%); font-size: .95rem; }
  .input-icon .form-control { padding-left: 2.5rem; }
  .warn-banner {
    background: rgba(255,179,71,.07); border: 1px solid rgba(255,179,71,.3);
    border-radius: 8px; padding: .65rem 1rem; margin-bottom: 1.5rem;
    font-family: var(--font-mono); font-size: .72rem; color: var(--warning);
    letter-spacing: .05em; text-align: center;
  }
</style>
{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="ring">🛡</div>
      <h2>ADMIN ACCESS</h2>
      <p>RESTRICTED CONTROL PANEL</p>
    </div>
    <div class="warn-banner">⚠ AUTHORISED PERSONNEL ONLY</div>
    <form method="POST" action="{% url 'AdminLoginCheck' %}">
      {% csrf_token %}
      <div class="form-group">
        <label>ADMIN ID</label>
        <div class="input-icon">
          <span>🔑</span>
          <input type="text" name="loginid" class="form-control" placeholder="Admin login ID" required/>
        </div>
      </div>
      <div class="form-group">
        <label>PASSWORD</label>
        <div class="input-icon">
          <span>🔒</span>
          <input type="password" name="pswd" class="form-control" placeholder="••••••••" required/>
        </div>
      </div>
      <button type="submit" class="btn btn-admin">🛡 AUTHENTICATE</button>
    </form>
  </div>
</div>
{% endblock %}
